[project]
name = "finalproject-surname-group"
version = "0.1.0"
description = "Консольное приложение для симуляции торговли валютами"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["prettytable>=3.12"]

[dependency-groups]
dev = ["ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valutatrade_hub"]

[tool.ruff]
line-length = 88
target-version = "py311"